[package]
name = "sokovision-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sokovision-gui"
path = "src/main.rs"

[dependencies]
sokovision-core = { path = "../sokovision-core" }
image.workspace = true
eframe = "0.37"
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
rust-i18n = "4"
sys-locale = "0.3"
rfd = "0.17"
arboard = "3.7"
xcap = "0.9"
serde_json = "1"
dirs = "6"

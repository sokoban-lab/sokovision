[package]
name = "sokovision-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sokovision"
path = "src/main.rs"

[dependencies]
sokovision-core = { path = "../sokovision-core" }
image.workspace = true
serde.workspace = true
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"

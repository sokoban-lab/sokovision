name: CD

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  meta:
    name: Resolve build ref
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.version.outputs.ref }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve tag and version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "sokovision-cli") | .version')

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "invalid release tag: $tag" >&2
              exit 1
            fi
            if [[ "v$version" != "$tag" ]]; then
              echo "tag $tag does not match Cargo.toml version $version" >&2
              exit 1
            fi
            git rev-parse "refs/tags/$tag" >/dev/null
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "tag $tag does not point to a commit on main" >&2
              exit 1
            fi
            ref="refs/tags/$tag"
          else
            tag=""
            ref="$GITHUB_SHA"
            echo "::notice::Manual build; building sokovision $version artifacts only."
          fi

          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build (windows-x86_64)
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64

      - name: Build release binaries
        run: cargo build --release --locked --workspace --target x86_64-pc-windows-msvc

      - name: Package release archives
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          for pkg in cli gui; do
            if [[ "$pkg" == "cli" ]]; then
              bin="sokovision.exe"
            else
              bin="sokovision-gui.exe"
            fi
            name="sokovision-${pkg}-${VERSION}-windows-x86_64"
            stage="${RUNNER_TEMP:?}/${name}"
            rm -rf "${stage}"
            mkdir -p "${stage}"
            cp "target/x86_64-pc-windows-msvc/release/${bin}" "${stage}/"
            7z a -tzip "dist/${name}.zip" "${stage}" > /dev/null
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sokovision-windows-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build (linux-x86_64)
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.ref }}
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libdbus-1-dev \
            libegl-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64

      - name: Build release binaries
        run: cargo build --release --locked --workspace --target x86_64-unknown-linux-gnu

      - name: Package release archives
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          for pkg in cli gui; do
            if [[ "$pkg" == "cli" ]]; then
              bin="sokovision"
            else
              bin="sokovision-gui"
            fi
            name="sokovision-${pkg}-${VERSION}-linux-x86_64"
            stage="${RUNNER_TEMP:?}/${name}"
            rm -rf "${stage}"
            mkdir -p "${stage}"
            cp "target/x86_64-unknown-linux-gnu/release/${bin}" "${stage}/"
            chmod +x "${stage}/${bin}"
            tar -czf "dist/${name}.tar.gz" -C "${RUNNER_TEMP}" "${name}"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sokovision-linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [meta, build-windows, build-linux]
    if: needs.meta.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip header --offline
          version: v2.14.2
        env:
          OUTPUT: release-notes.md

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: sokovision-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/sokovision-*.zip dist/sokovision-*.tar.gz)
          if [[ "${#assets[@]}" -ne 4 ]]; then
            echo "expected 4 release archives, found ${#assets[@]}: ${assets[*]}" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$VERSION Release" --notes-file release-notes.md
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "$VERSION Release" --notes-file release-notes.md --verify-tag
          fi
